<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>阶段 B · 填色轮廓</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c2430;
        --muted: #5c6b7a;
        --line: #d5dde6;
        --paper: #f4f7fb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 "Iowan Old Style", Palatino, "Songti SC", serif;
        color: var(--ink);
        background: var(--paper);
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 24px 48px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 28px;
        font-weight: 600;
      }
      p.lead {
        margin: 0 0 18px;
        color: var(--muted);
      }
      .stage {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      figure {
        margin: 0;
        background: white;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      figcaption {
        padding: 10px 14px 0;
        font-size: 13px;
        letter-spacing: 0.04em;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        background:
          linear-gradient(#e7eef6 1px, transparent 1px) 0 0 / 100% 40px,
          linear-gradient(90deg, #e7eef6 1px, transparent 1px) 0 0 / 40px 100%,
          #fbfcfe;
      }
      .readout {
        margin: 14px 0 0;
        color: var(--muted);
      }
      .readout strong { color: var(--ink); font-weight: 600; }
      .controls {
        margin-top: 22px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px 18px;
      }
      label {
        display: grid;
        grid-template-columns: 4.5em 1fr 3.2em;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      output { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }
      button {
        font: inherit;
        border: 1px solid var(--line);
        background: white;
        border-radius: 999px;
        padding: 6px 14px;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: var(--ink);
        color: white;
        border-color: var(--ink);
      }
      @media (max-width: 800px) {
        .stage, .controls { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>从手写姿态到填色轮廓</h1>
      <p class="lead">左边是绑定姿态，右边是当前手写姿态。颜色和三角形都来自填充模块。拖动关节，或直接套用测试里的屈膝。</p>
      <div class="stage">
        <figure>
          <figcaption>绑定姿态</figcaption>
          <canvas id="rest" width="640" height="760"></canvas>
        </figure>
        <figure>
          <figcaption>当前姿态</figcaption>
          <canvas id="posed" width="640" height="760"></canvas>
        </figure>
      </div>
      <p class="readout" id="readout"></p>
      <div class="actions">
        <button type="button" id="stand">站立</button>
        <button type="button" id="knee">屈左膝 −0.8</button>
        <button type="button" id="face-pos" aria-pressed="true">朝向 +1</button>
        <button type="button" id="face-neg" aria-pressed="false">朝向 −1</button>
      </div>
      <div class="controls" id="controls"></div>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
