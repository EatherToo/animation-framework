<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spine · Render Engine Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f131b;
        --panel: #181e29;
        --line: #2b3444;
        --text: #e6edf7;
        --dim: #93a1b5;
        --accent: #5ad1b1;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        display: flex;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      #stage { flex: 1; min-width: 0; position: relative; background: #181c26; }
      #view { display: block; width: 100%; height: 100%; }
      aside {
        width: 300px;
        flex: none;
        overflow: auto;
        background: var(--panel);
        border-left: 1px solid var(--line);
        padding: 18px 16px 28px;
      }
      h1 { margin: 0 0 6px; font-size: 17px; font-weight: 650; }
      h2 {
        margin: 18px 0 8px;
        font-size: 12px;
        letter-spacing: 0.1em;
        color: var(--dim);
        font-weight: 600;
      }
      p.note { margin: 0; color: var(--dim); }
      .info {
        margin-top: 12px;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #121722;
        color: #c8d4e4;
        font: 11.5px/1.5 ui-monospace, Menlo, Consolas, monospace;
      }
      .field { display: grid; gap: 6px; margin-top: 14px; color: var(--dim); }
      .field select, .field input { width: 100%; box-sizing: border-box; }
      select { min-height: 34px; padding: 4px 8px; background: #232d3c; color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
      output { color: var(--text); }
      .commands { display: flex; gap: 8px; margin-top: 16px; }
      .commands button { flex: 1; }
      [hidden] { display: none !important; }
      @media (max-width: 680px) {
        body { flex-direction: column; }
        #stage { min-height: 55vh; }
        aside { box-sizing: border-box; width: 100%; max-height: 45vh; border-left: 0; border-top: 1px solid var(--line); padding: 12px 16px; }
      }
      .joint {
        display: grid;
        grid-template-columns: 5.5em 3.2em 1fr;
        gap: 6px;
        align-items: center;
        margin: 7px 0;
      }
      .joint .value { color: var(--accent); text-align: right; font-variant-numeric: tabular-nums; }
      input[type='range'] { width: 100%; accent-color: var(--accent); }
      button {
        font: inherit;
        color: var(--text);
        background: #232d3c;
        border: 1px solid var(--line);
        border-radius: 6px;
        height: 30px;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button.reset { width: 100%; margin-top: 8px; }
      pre.help {
        margin: 0;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #121722;
        color: #a9b8cc;
        font: 11.5px/1.55 ui-monospace, Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }
      pre.error {
        position: absolute;
        left: 16px;
        right: 16px;
        top: 16px;
        margin: 0;
        padding: 12px 14px;
        max-height: 70%;
        overflow: auto;
        background: #2a1618;
        border: 1px solid #8b3b42;
        border-radius: 8px;
        color: #ffd9dc;
        font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }
      pre.error[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="view"></canvas>
      <pre id="error" class="error" hidden></pre>
    </div>
    <aside id="pose">
      <h1>Spine Preview</h1>
      <label class="field">场景
        <select id="sample">
          <option value="spineboy">Spineboy</option>
          <option value="raptor">Raptor</option>
          <option value="stretchyman">Stretchyman</option>
          <option value="core2d">Core2D 人形</option>
        </select>
      </label>
      <div id="runtimeInfo" class="info">初始化中…</div>
      <div id="spineControls">
        <label class="field">动画<select id="animation"></select></label>
        <label class="field">后端<select id="backend"><option value="cpu">CPU</option><option value="webgl">WebGL2</option></select></label>
        <label class="field">速度 <output id="speedValue">1×</output><input id="speed" type="range" min="0" max="2" step="0.1" value="1"></label>
        <div class="commands"><button id="playPause" type="button">暂停</button><button id="restart" type="button">重新播放</button></div>
        <p><a href="/pose.html">打开 Spineboy 姿态编辑</a></p>
      </div>
      <div id="coreControls" hidden>
        <h2>骨骼旋转叠加（度）</h2>
        <div id="composerControls"></div>
        <button id="reset" class="reset" type="button">重置姿态 / 清零滑杆</button>
      </div>
    </aside>
    <script src="./main.js"></script>
  </body>
</html>
