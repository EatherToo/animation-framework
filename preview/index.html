<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>渲染引擎 · 正面</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #5c5c5c;
        overflow: hidden;
        color: #ececec;
        font: 13px/1.4 "Iowan Old Style", Palatino, "Songti SC", serif;
      }
      body {
        display: flex;
      }
      #stage {
        flex: 1;
        min-width: 0;
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      aside {
        width: 292px;
        flex: none;
        overflow: auto;
        background: #2a2a2a;
        border-left: 1px solid #1a1a1a;
        padding: 18px 16px 28px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 18px;
        font-weight: 600;
      }
      p.note {
        margin: 0 0 14px;
        color: #b7b7b7;
      }
      h2 {
        margin: 12px 0 8px;
        font-size: 13px;
        letter-spacing: 0.08em;
        color: #9d9d9d;
      }
      .joint {
        display: grid;
        grid-template-columns: 3.2em 28px 1fr 28px;
        gap: 6px;
        align-items: center;
        margin-bottom: 4px;
      }
      .joint span {
        font-variant-numeric: tabular-nums;
      }
      .range {
        grid-column: 2 / -1;
        margin: -2px 0 8px;
        color: #8d8d8d;
        font-size: 12px;
      }
      button {
        font: inherit;
        color: inherit;
        background: #3a3a3a;
        border: 1px solid #555;
        border-radius: 999px;
        height: 28px;
        cursor: pointer;
      }
      button.reset {
        width: 100%;
        margin: 0 0 4px;
      }
      input[type='range'] {
        width: 100%;
        accent-color: #3dff9a;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="view"></canvas>
    </div>
    <aside id="pose"></aside>
    <script src="./main.js"></script>
  </body>
</html>
