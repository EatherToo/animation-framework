<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>蜘蛛侠 · 引擎蒙皮</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c2430;
        --muted: #5c6b7a;
        --line: #d5dde6;
        --paper: #f4f7fb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 "Iowan Old Style", Palatino, "Songti SC", serif;
        color: var(--ink);
        background: var(--paper);
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 24px 48px;
      }
      h1 { margin: 0 0 6px; font-size: 28px; font-weight: 600; }
      p.lead { margin: 0 0 18px; color: var(--muted); }
      figure {
        margin: 0;
        background: #10141c;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        background:
          radial-gradient(ellipse at 50% 18%, #243044 0%, #10141c 58%);
      }
      .readout { margin: 14px 0 0; color: var(--muted); }
      .readout strong { color: var(--ink); font-weight: 600; }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
        align-items: center;
      }
      button {
        font: inherit;
        border: 1px solid var(--line);
        background: white;
        border-radius: 999px;
        padding: 6px 14px;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: var(--ink);
        color: white;
        border-color: var(--ink);
      }
      label.crouch,
      label.view {
        display: grid;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      label.crouch {
        grid-template-columns: 3em 140px 3em;
        margin-left: 8px;
      }
      label.view {
        grid-template-columns: 3em minmax(0, 1fr) 3em;
        flex: 1 1 240px;
        min-width: 0;
        max-width: 460px;
      }
      label.view input { width: 100%; min-width: 0; }
      output { font-variant-numeric: tabular-nums; color: var(--muted); }
      canvas { cursor: grab; touch-action: none; }
      canvas:active { cursor: grabbing; }
    </style>
  </head>
  <body>
    <main>
      <h1>蜘蛛侠</h1>
      <p class="lead">绕着这身衣服转。每个角度只用最近的一张拆开的贴图，头、躯干、手臂和腿分开贴到骨骼上，左右对称的小图翻转后共用。行走时这些小图跟着姿态弯，不再把两张整图叠在一起。</p>
      <figure>
        <canvas id="stage" width="1200" height="680"></canvas>
      </figure>
      <p class="readout" id="readout">正在准备贴图…</p>
      <div class="actions">
        <button type="button" id="stand" aria-pressed="true">站立</button>
        <button type="button" id="walk">行走</button>
        <button type="button" id="run">跑步</button>
        <button type="button" id="back">倒退</button>
        <button type="button" id="pause" aria-pressed="false">暂停</button>
        <label class="crouch">蹲伏
          <input id="crouch" type="range" min="0" max="1" step="0.01" value="0" />
          <output id="crouch-out">0.00</output>
        </label>
      </div>
      <div class="actions">
        <button type="button" id="spin" aria-pressed="true">停止旋转</button>
        <button type="button" data-view="0">右侧 0°</button>
        <button type="button" data-view="90" aria-pressed="true">正面 90°</button>
        <button type="button" data-view="180">左侧 180°</button>
        <button type="button" data-view="270">背面 270°</button>
        <label class="view">视角
          <input id="view" type="range" min="0" max="359" step="1" value="90" />
          <output id="view-out">90°</output>
        </label>
      </div>
    </main>
    <script src="./spider.js?v=5"></script>
  </body>
</html>
