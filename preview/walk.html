<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>阶段 D · 走出一步</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c2430;
        --muted: #5c6b7a;
        --line: #d5dde6;
        --paper: #f4f7fb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 "Iowan Old Style", Palatino, "Songti SC", serif;
        color: var(--ink);
        background: var(--paper);
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 24px 48px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 28px;
        font-weight: 600;
      }
      p.lead {
        margin: 0 0 18px;
        color: var(--muted);
      }
      figure {
        margin: 0;
        background: white;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        background: #fbfcfe;
      }
      .readout {
        margin: 14px 0 0;
        color: var(--muted);
      }
      .readout strong { color: var(--ink); font-weight: 600; }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
        align-items: center;
      }
      button {
        font: inherit;
        border: 1px solid var(--line);
        background: white;
        border-radius: 999px;
        padding: 6px 14px;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: var(--ink);
        color: white;
        border-color: var(--ink);
      }
      label.crouch {
        display: grid;
        grid-template-columns: 3em 140px 3em;
        align-items: center;
        gap: 8px;
        margin-left: 8px;
        font-size: 13px;
      }
      label.view {
        display: grid;
        grid-template-columns: 3em minmax(0, 1fr) 3em;
        align-items: center;
        gap: 8px;
        flex: 1 1 240px;
        min-width: 0;
        max-width: 460px;
        font-size: 13px;
      }
      label.view input { width: 100%; min-width: 0; }
      output { font-variant-numeric: tabular-nums; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>能计划并走出一步</h1>
      <p class="lead">身高 1.70 米。每个画面按 1/60 秒调用一次姿态求解。实心点是已经钉住的世界落点，空心点是这一步要落地的位置。镜头跟着骨盆走。视角绕着身体转一圈共 360 档，只换画面，不重解姿态。</p>
      <figure>
        <canvas id="stage" width="1200" height="680"></canvas>
      </figure>
      <p class="readout" id="readout"></p>
      <div class="actions">
        <button type="button" id="stand">站立</button>
        <button type="button" id="walk" aria-pressed="true">行走</button>
        <button type="button" id="run">跑步</button>
        <button type="button" id="back">倒退</button>
        <button type="button" id="pause" aria-pressed="false">暂停</button>
        <label class="crouch">蹲伏
          <input id="crouch" type="range" min="0" max="1" step="0.01" value="0" />
          <output id="crouch-out">0.00</output>
        </label>
      </div>
      <div class="actions">
        <button type="button" data-view="0" aria-pressed="true">右侧 0°</button>
        <button type="button" data-view="90" aria-pressed="false">正面 90°</button>
        <button type="button" data-view="180" aria-pressed="false">左侧 180°</button>
        <button type="button" data-view="270" aria-pressed="false">背面 270°</button>
        <label class="view">视角
          <input id="view" type="range" min="0" max="359" step="1" value="0" />
          <output id="view-out">0°</output>
        </label>
      </div>
    </main>
    <script src="./walk.js"></script>
  </body>
</html>
