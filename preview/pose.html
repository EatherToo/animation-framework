<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spineboy · 姿态编辑</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.45 system-ui, sans-serif; background: #191b22; color: #f2f3f5; }
    * { box-sizing: border-box; }
    body { margin: 0; display: flex; height: 100dvh; }
    main { flex: 1; min-width: 0; position: relative; background: #191b22; }
    canvas { display: block; width: 100%; height: 100%; }
    aside { width: 320px; flex: none; padding: 18px; overflow: auto; border-left: 1px solid #414752; background: #262932; }
    h1 { margin: 0 0 12px; font-size: 18px; }
    h2 { margin: 20px 0 6px; font-size: 13px; color: #b9c7d5; }
    p { margin: 0 0 12px; color: #bac2cd; font-size: 12px; }
    .warning { border-left: 3px solid #f3ad61; padding-left: 10px; }
    .buttons { display: flex; gap: 8px; }
    button { min-height: 34px; flex: 1; border-radius: 4px; background: #353c47; border: 1px solid #596273; color: #f2f3f5; cursor: pointer; }
    button:hover { border-color: #74c6b4; }
    a { color: #93decf; }
    .joint { display: grid; grid-template-columns: 82px 42px minmax(0, 1fr); align-items: center; gap: 8px; margin: 10px 0; }
    .joint output { text-align: right; font-variant-numeric: tabular-nums; color: #93decf; }
    input[type=range] { min-width: 0; width: 100%; accent-color: #71c9ba; }
    #error { position: absolute; top: 12px; left: 12px; right: 12px; padding: 12px; background: #56232a; color: white; white-space: pre-wrap; }
    #error[hidden] { display: none; }
    @media (max-width: 680px) { body { flex-direction: column; } main { min-height: 52dvh; } aside { width: 100%; max-height: 48dvh; border-left: 0; border-top: 1px solid #414752; } }
  </style>
</head>
<body>
  <main><canvas id="view"></canvas><div id="error" role="alert" hidden></div></main>
  <aside>
    <h1>Spineboy · 姿态编辑</h1>
    <p class="warning">近似正面姿态：原始素材只有侧面头脸与躯干，这里仅重排骨骼，不能呈现真正的正面图。</p>
    <div class="buttons"><button id="approx" type="button">近似正面</button><button id="original" type="button">原始姿态</button></div>
    <h2>骨骼旋转</h2>
    <div id="controls"></div>
    <button id="reset" type="button" style="width:100%;margin-top:10px">重置角度</button>
    <p style="margin-top:20px"><a href="/">返回动画预览</a></p>
  </aside>
  <script src="./pose.js"></script>
</body>
</html>
