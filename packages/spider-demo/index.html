<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eff2ed">
  <title>重岳 · 正面站姿</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { color: #263e38; background: #eff2ed; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    button, input { font: inherit; }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    button { border: 1px solid #d5ded5; border-radius: 9px; background: #fff; color: #345347; padding: 9px 13px; cursor: pointer; transition: background .15s; }
    button:hover { background: #eaf0e8; }
    button:disabled { opacity: .45; cursor: wait; }
    a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #537b60; outline-offset: 4px; }
    .page-header { min-height: 88px; padding: 18px 30px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .identity { display: flex; align-items: center; gap: 14px; }
    .seal { display: grid; place-content: center; width: 42px; height: 42px; border: 1px solid #bac9b8; border-radius: 12px; font: 22px Georgia, "Songti SC", serif; color: #5b765c; }
    h1 { font: 600 21px "Songti SC", "Noto Serif CJK SC", serif; letter-spacing: 2px; margin: 0 0 5px; }
    .identity p { font-size: 12px; color: #7a8a7a; margin: 0; letter-spacing: 1px; }
    .workspace { height: calc(100dvh - 108px); min-height: 600px; margin: 0 22px 20px; display: grid; grid-template-columns: minmax(0, 1fr) 336px; border: 1px solid #d9e1d5; border-radius: 18px; overflow: hidden; background: #fafbf8; box-shadow: 0 10px 40px #344e3910; }
    .stage { position: relative; min-width: 0; min-height: 0; isolation: isolate; background: radial-gradient(ellipse at 50% 43%, #fffef9 0%, #f4f5ec 55%, #e7eddf 100%); }
    .stage::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: .4; background-image: radial-gradient(#a6b39d 0.6px, transparent 0.6px); background-size: 22px 22px; }
    .stage-label { position: absolute; top: 22px; left: 24px; display: flex; align-items: center; gap: 9px; color: #7b8b73; font-size: 12px; letter-spacing: 2px; pointer-events: none; }
    .stage-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #8da27e; }
    canvas { width: 100%; height: calc(100% - 76px); display: block; cursor: grab; touch-action: none; }
    canvas:active { cursor: grabbing; }
    .stage-tools { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; padding: 6px 7px 6px 15px; border: 1px solid #d5ded4; border-radius: 12px; background: #ffffffed; box-shadow: 0 4px 14px #384d3110; white-space: nowrap; }
    .skeleton-toggle { display: flex; align-items: center; gap: 7px; cursor: pointer; font-size: 12px; }
    input[type=checkbox] { accent-color: #607c52; width: 16px; height: 16px; margin: 0; }
    .stage-tools button { font-size: 12px; background: #f0f4ed; border-color: transparent; }
    #status { position: absolute; inset: 0; display: grid; place-content: center; padding: 24px; color: #6b8167; text-align: center; pointer-events: none; }
    #status[hidden] { display: none; }
    aside { min-height: 0; display: flex; flex-direction: column; background: #ffffffed; border-left: 1px solid #dce3d8; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 22px 20px 18px; border-bottom: 1px solid #edf0e9; }
    h2 { font-size: 15px; margin: 0 0 5px; font-weight: 600; }
    .panel-head p { font-size: 11px; color: #8b9986; margin: 0; }
    #reset { font-size: 11px; padding: 8px 9px; }
    #controls { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #cad6c4 transparent; padding: 0 20px; }
    section { padding: 14px 0 12px; border-bottom: 1px solid #edf0e9; }
    section:last-child { border-bottom: 0; }
    h3 { margin: 0 0 6px; color: #819078; font-size: 11px; font-weight: 500; letter-spacing: 2px; }
    .joint { display: grid; grid-template-columns: 42px minmax(0, 1fr) 35px; align-items: center; gap: 12px; min-height: 37px; }
    .joint label { font-size: 12px; color: #50634c; }
    .joint output { font-size: 11px; text-align: right; color: #819078; font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; margin: 0; accent-color: #718a5e; cursor: pointer; }
    .panel-footer { padding: 16px 20px 18px; border-top: 1px solid #edf0e9; }
    #export { width: 100%; border-color: #47633e; background: #47633e; color: #fff; padding: 11px; }
    #export:hover { background: #385430; }
    .hint { margin: 12px 0 0; color: #8b9986; font-size: 11px; line-height: 1.7; }
    @media (max-width: 760px) {
      .page-header { padding: 18px 16px; gap: 14px; flex-wrap: wrap; }
      h1 { font-size: 19px; }
      .workspace { height: auto; min-height: 0; margin: 0 12px 14px; grid-template-columns: 1fr; border-radius: 14px; }
      .stage { height: 68svh; min-height: 420px; max-height: 720px; }
      .stage-label { top: 18px; left: 18px; }
      .stage-tools { bottom: 16px; }
      aside { border-left: 0; border-top: 1px solid #dce3d8; }
      .panel-head { padding: 18px 20px; }
      #controls { overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 25px; }
      section:first-child { grid-column: 1 / -1; }
      .joint { gap: 8px; min-height: 42px; }
      input[type=range] { min-height: 30px; }
      .panel-footer { padding-top: 18px; }
    }
    @media (max-width: 420px) {
      .identity { gap: 10px; }
      .seal { width: 36px; height: 36px; }
      #controls { display: block; }
      .stage { min-height: 380px; }
    }
  </style>
  <script type="module" src="/main.js"></script>
</head>
<body>
  <header class="page-header">
    <div class="identity"><span class="seal" aria-hidden="true">岳</span><div><h1>重岳 · 正面站姿</h1><p>从自然站姿，调整每一处细节</p></div></div>
  </header>
  <div class="workspace">
    <main class="stage" aria-label="正面站姿预览">
      <div class="stage-label" aria-hidden="true">自然站姿</div>
      <canvas id="character" role="img" aria-label="重岳正面自然站姿，可通过关节控制调整姿态"></canvas>
      <div id="status" role="status">正在载入重岳 · 正面站姿…</div>
      <div class="stage-tools"><label class="skeleton-toggle"><input id="show-skeleton" type="checkbox" disabled>显示骨架</label><button id="fit" type="button" disabled>适应画面</button></div>
    </main>
    <aside aria-label="关节活动控制面板">
      <div class="panel-head"><div><h2>关节微调</h2><p>16 个关节 · 相对自然站姿</p></div><button id="reset" type="button" disabled>恢复自然站姿</button></div>
      <div id="controls"></div>
      <div class="panel-footer"><button id="export" type="button" disabled>导出透明 PNG</button><p class="hint">左右以人物自身为准；拖动平移，滚轮缩放。24 根骨骼，含 3 根头发骨骼。</p></div>
    </aside>
  </div>
</body>
</html>
